<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thêm bệnh nhân')}"></head>
<body>
<div th:replace="~{fragments :: staffSidebar('patients')}"></div>

<main class="main">
  <header th:replace="~{fragments :: staffTopbar('Thêm bệnh nhân mới')}"></header>
  <div class="content">

    <div style="max-width:680px;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="ti ti-user-plus"></i> Thông tin bệnh nhân</div>
        </div>
        <div style="padding:24px;">
          <form th:action="@{/staff/patients/save}" method="post" th:object="${patient}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-section">
              <div class="form-section-title"><i class="ti ti-user"></i> Thông tin cá nhân</div>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">Họ và tên *</label>
                  <input class="form-input" type="text" th:field="*{fullName}" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Tên đăng nhập *</label>
                  <input class="form-input" type="text" th:field="*{username}" placeholder="nguyenvana" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Ngày sinh *</label>
                  <div style="display: flex; gap: 8px;">
                    <select id="dobDay" required style="flex: 1; background: #1a2440; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; color: #e8edf5; font-size: 13px; outline: none; cursor:pointer;"></select>
                    <select id="dobMonth" required style="flex: 1; background: #1a2440; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; color: #e8edf5; font-size: 13px; outline: none; cursor:pointer;"></select>
                    <select id="dobYear" required style="flex: 1.5; background: #1a2440; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; color: #e8edf5; font-size: 13px; outline: none; cursor:pointer;"></select>
                  </div>
                  <input type="hidden" th:field="*{dob}" id="dob">
                </div>
                <div class="form-group">
                  <label class="form-label">Giới tính *</label>
                  <select class="form-input" th:field="*{gender}" required>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Số điện thoại</label>
                  <input class="form-input" type="text" th:field="*{phone}" placeholder="0901234567">
                </div>
                <div class="form-group">
                  <label class="form-label">Địa chỉ</label>
                  <input class="form-input" type="text" th:field="*{address}" placeholder="Hà Nội">
                </div>
              </div>
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
              <a th:href="@{/staff/patients}" class="btn btn-ghost">Hủy</a>
              <button type="submit" class="btn btn-primary">
                <i class="ti ti-check"></i> Lưu bệnh nhân
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</main>
<script th:src="@{/js/main.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const daySelect = document.getElementById('dobDay');
  const monthSelect = document.getElementById('dobMonth');
  const yearSelect = document.getElementById('dobYear');
  const hiddenDob = document.getElementById('dob');

  // Populate days
  let dayHtml = '<option value="">Ngày</option>';
  for (let i = 1; i <= 31; i++) {
    dayHtml += `<option value="${i}">${i}</option>`;
  }
  daySelect.innerHTML = dayHtml;

  // Populate months
  let monthHtml = '<option value="">Tháng</option>';
  for (let i = 1; i <= 12; i++) {
    monthHtml += `<option value="${i}">${i}</option>`;
  }
  monthSelect.innerHTML = monthHtml;

  // Populate years
  let yearHtml = '<option value="">Năm</option>';
  const currentYear = new Date().getFullYear();
  for (let i = currentYear; i >= 1900; i--) {
    yearHtml += `<option value="${i}">${i}</option>`;
  }
  yearSelect.innerHTML = yearHtml;

  function updateDob() {
    const d = daySelect.value;
    const m = monthSelect.value;
    const y = yearSelect.value;
    if (d && m && y) {
      hiddenDob.value = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    } else {
      hiddenDob.value = '';
    }
  }

  daySelect.addEventListener('change', updateDob);
  monthSelect.addEventListener('change', updateDob);
  yearSelect.addEventListener('change', updateDob);

  // Pre-select if value exists
  const dobVal = hiddenDob.value;
  if (dobVal) {
    const parts = dobVal.split('-');
    if (parts.length === 3) {
      yearSelect.value = parseInt(parts[0]);
      monthSelect.value = parseInt(parts[1]);
      daySelect.value = parseInt(parts[2]);
    }
  }
});
</script>
</body>
</html>
