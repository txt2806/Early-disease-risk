<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nhật ký tự khai báo sức khỏe')}"></head>
<body>
  <div th:replace="~{fragments :: staffSidebar('patients')}"></div>
  <main class="main">
    <header th:replace="~{fragments :: staffTopbar('Nhật ký tự khai báo sức khỏe')}"></header>
    <div class="content">

      <div class="alert-success" th:if="${success}" th:text="${success}"></div>

      <!-- Patient header -->
      <div class="detail-header" style="margin-bottom: 24px;">
        <div class="detail-info">
          <div class="detail-avatar"
            th:text="${patient != null && patient.fullName != null && !patient.fullName.isEmpty() ? patient.fullName.charAt(0) : 'U'}"
            style="background:linear-gradient(135deg,#e05a5a,#c0392b);">A</div>
          <div>
            <div class="detail-name" th:text="${patient != null ? patient.fullName : ''}">Tên bệnh nhân</div>
            <div class="detail-meta">
              <span th:text="${patient.dob != null} ? 'Sinh: ' + ${#temporals.format(patient.dob, 'dd/MM/yyyy')} : 'Sinh: --'">Sinh:</span>
              <span th:text="${patient.gender}">Nam</span>
              <span th:text="${patient.phone}">SĐT</span>
              <span th:text="${patient.address}">Địa chỉ</span>
            </div>
          </div>
        </div>
        <div class="detail-actions">
          <a th:href="@{/staff/alerts}" class="btn btn-ghost">← Quay lại Cảnh báo</a>
          <a th:href="@{/staff/patients/{id}(id=${patient.patientId})}" class="btn btn-ghost">Hồ sơ bệnh nhân</a>
        </div>
      </div>

      <!-- Nhật ký đã ghi nhận -->
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="ti ti-history"></i> Nhật ký sức khỏe tự khai báo của bệnh nhân</div>
        </div>
        <table class="patient-table">
          <thead>
            <tr>
              <th>Thời gian khai báo</th>
              <th>Nhịp tim hiện tại</th>
              <th>Triệu chứng đi kèm</th>
              <th>Trạng thái hệ thống</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${monitoringLogs}">
              <td th:text="${log.LogDate != null ? #strings.substring(log.LogDate.toString(), 0, 16) : '--'}" style="font-family:monospace; font-size:13px; color:#8a96b0;">--</td>
              <td style="font-weight: 700; color: #e8edf5; font-size: 14px;" th:text="${log.CurrentHeartRate + ' BPM'}">--</td>
              <td th:text="${log.Symptoms}" style="font-size: 13px; color: #cbd5e1; max-width: 400px; word-wrap: break-word; white-space: normal; line-height: 1.4;">--</td>
              <td>
                <span class="risk-badge" th:classappend="${log.TriggeredAlert} ? 'risk-HIGH' : 'risk-LOW'" th:text="${log.TriggeredAlert} ? 'Cảnh báo' : 'Bình thường'">Bình thường</span>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(monitoringLogs)}">
              <td colspan="4" style="text-align:center;color:#8a96b0;padding:40px 20px;">
                Chưa có nhật ký tự theo dõi nào được lưu cho bệnh nhân này.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
