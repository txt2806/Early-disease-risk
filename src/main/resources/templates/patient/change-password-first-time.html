<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu lần đầu')}"></head>
<body style="background:#0b0f19;color:#e8edf5;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">

<div style="width:100%;max-width:440px;background:#111827;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
  
  <div style="text-align:center;margin-bottom:24px;">
    <div style="width:56px;height:56px;background:rgba(16,185,129,0.15);color:#10b981;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;">
      🔒
    </div>
    <h2 style="font-size:20px;font-weight:700;color:#e8edf5;margin-bottom:6px;">Đổi mật khẩu lần đầu</h2>
    <p style="font-size:13px;color:#8a96b0;line-height:1.5;">
      Tài khoản của bạn được khởi tạo bởi phòng khám. Vui lòng thiết lập mật khẩu mới để bảo mật dữ liệu y tế cá nhân trước khi tiếp tục.
    </p>
  </div>

  <div th:if="${error}" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;">
    ⚠️ <span th:text="${error}">Thông báo lỗi</span>
  </div>

  <form th:action="@{/patient/change-password-first-time/save}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:600;color:#8a96b0;margin-bottom:6px;text-transform:uppercase;">Tài khoản đăng nhập</label>
      <input type="text" th:value="${patient.username}" disabled style="width:100%;background:#1e293b;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;color:#94a3b8;font-size:14px;outline:none;">
    </div>

    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;font-weight:600;color:#8a96b0;margin-bottom:6px;text-transform:uppercase;">Mật khẩu mới (tối thiểu 3 ký tự)</label>
      <input type="password" name="newPassword" placeholder="Nhập mật khẩu mới..." required minlength="3" style="width:100%;background:#1e293b;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:#e8edf5;font-size:14px;outline:none;">
    </div>

    <div style="margin-bottom:24px;">
      <label style="display:block;font-size:12px;font-weight:600;color:#8a96b0;margin-bottom:6px;text-transform:uppercase;">Xác nhận mật khẩu mới</label>
      <input type="password" name="confirmPassword" placeholder="Nhập lại mật khẩu mới..." required minlength="3" style="width:100%;background:#1e293b;border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:#e8edf5;font-size:14px;outline:none;">
    </div>

    <button type="submit" style="width:100%;background:#10b981;color:white;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background 0.2s;">
      ✅ Xác nhận & Vào Dashboard
    </button>
  </form>

</div>

</body>
</html>
